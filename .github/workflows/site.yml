name: Static Site CI

on:
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "*.html"
      - "config.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The workflow may be dispatched with ref=data; the code always comes
          # from master, data is overlaid in the next step.
          ref: master
          fetch-depth: 1

      - name: Fetch latest data (branch 'data')
        run: |
          # Data (api/, history/) lives only in the 'data' branch. It is baked
          # into every deployment, so the browser reads it from its own domain
          # with no CDN delay. If the branch is missing the build fails and
          # Pages keeps the last working deployment.
          git fetch --depth 1 origin data
          git checkout FETCH_HEAD -- api history
          echo "Данные взяты из ветки data"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prune unnecessary files
        run: |
          rm -rf .git .github scripts .env .env.example .gitignore README.md monitor.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifact is uploaded successfully, but the Actions API can be
          # briefly stale — deploy-pages then reports "Found 0 artifact(s)".
          # Poll until it is actually visible before deploying.
          for i in $(seq 1 20); do
            n=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq '[.artifacts[]? | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "artifact visible"; exit 0; fi
            sleep 3
          done
          echo "artifact still not visible — deploy-pages may fail"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5